<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>PHBTI 🏛️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      background: linear-gradient(180deg, #c9d8ec 0%, #dfe9df 55%, #f4ecd9 100%);
      color: #4a4a3f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 44px;
    }

    .top {
      width: min(94vw, 460px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
    }
    .nav-btn {
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(70, 80, 90, 0.10);
      text-decoration: none;
    }
    .top .page-title { font-size: 16px; font-weight: 800; flex: 1; text-align: center; }

    .view { width: min(94vw, 460px); display: none; flex-direction: column; align-items: center; }
    .view.on { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.86);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: 0 8px 26px rgba(70, 80, 90, 0.14);
      margin-bottom: 14px;
    }
    .card h2 { font-size: 17px; margin-bottom: 4px; }
    .card .sub { font-size: 12.5px; color: #7a8290; }

    .cta {
      width: 100%;
      appearance: none;
      border: none;
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(135deg, #8fb4d9, #b4c99b);
      color: #2f3d4a;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(90, 130, 170, 0.35);
      transition: transform 0.12s ease;
    }
    .cta:active { transform: scale(0.97); }
    .cta:disabled { opacity: 0.45; }
    .ghost {
      appearance: none;
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.8);
      color: #4a5568;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-row { display: flex; gap: 10px; width: 100%; }

    .intro-emoji { font-size: 54px; text-align: center; margin: 6px 0 10px; }
    .who-row { display: flex; gap: 10px; margin: 14px 0 6px; }
    .who-chip {
      flex: 1;
      border: 2.5px solid transparent;
      border-radius: 16px;
      padding: 16px 10px;
      background: #eef2f6;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      color: #4a5568;
      cursor: pointer;
      text-align: center;
    }
    .who-chip.sel { border-color: #8fb4d9; background: #e3eef8; }
    .who-chip .we { font-size: 26px; display: block; margin-bottom: 4px; }

    .prog-track { width: 100%; height: 8px; border-radius: 999px; background: rgba(70, 80, 90, 0.10); overflow: hidden; margin-bottom: 8px; }
    .prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8fb4d9, #b4c99b); transition: width 0.25s ease; }
    .prog-num { font-size: 11.5px; color: #8a94a0; font-weight: 700; text-align: right; margin-bottom: 14px; }
    .q-text { font-size: 17px; font-weight: 800; line-height: 1.6; min-height: 84px; display: flex; align-items: center; }
    .ans-col { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
    .ans-btn {
      width: 100%;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 13px 16px;
      background: #eef2f6;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s ease;
    }
    .ans-btn:active { transform: scale(0.98); }
    .ans-btn.sel { border-color: #8fb4d9; background: #e3eef8; }
    .q-back { background: none; border: none; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #8a94a0; cursor: pointer; text-decoration: underline; margin-top: 12px; }

    /* result */
    .ph-card { text-align: center; }
    .ph-card .pe { font-size: 64px; }
    .ph-card .pt { font-size: 13px; font-weight: 800; letter-spacing: 3px; color: #8fb4d9; margin-top: 6px; }
    .ph-card .pn { font-size: 22px; font-weight: 800; margin-top: 2px; }
    .ph-card .pd { font-size: 13.5px; color: #6a7280; line-height: 1.75; margin-top: 12px; text-align: left; }

    .axis-row { margin-top: 14px; }
    .axis-head { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; margin-bottom: 4px; }
    .axis-head .w { color: #4a5568; }
    .axis-head .l { color: #b0b8c2; }
    .axis-track { height: 13px; border-radius: 999px; background: rgba(70, 80, 90, 0.08); overflow: hidden; }
    .axis-fill { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8fb4d9, #b4c99b); width: 0; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }

    .cmp-box { display: flex; align-items: center; gap: 14px; background: #eef2f6; border-radius: 16px; padding: 14px 16px; }
    .cmp-box .ce { font-size: 40px; }
    .cmp-box .cn { font-size: 14.5px; font-weight: 800; }
    .cmp-box .cd { font-size: 12px; color: #7a8290; margin-top: 2px; line-height: 1.6; }
    .cmp-note { font-size: 12.5px; color: #7a8290; margin-top: 10px; line-height: 1.65; }

    .disclaimer { font-size: 11.5px; color: #8a94a0; text-align: center; line-height: 1.7; margin: 6px 0 12px; }
    .sync-note { font-size: 12px; color: #9aa4ae; font-weight: 600; text-align: center; margin: 4px 0 10px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="top">
    <a class="nav-btn" href="./index.html" id="backBtn">← Back</a>
    <div class="page-title">🏛️ PHBTI</div>
    <button class="nav-btn" id="langBtn">EN</button>
  </div>

  <!-- intro -->
  <div class="view on" id="v-intro">
    <div class="card">
      <div class="intro-emoji">🏛️</div>
      <h2 id="inTitle" style="text-align:center"></h2>
      <div class="sub" id="inSub" style="text-align:center; margin-top:6px; line-height:1.7"></div>
      <div class="who-row" id="whoRow">
        <button class="who-chip" data-who="HyeonWoo"><span class="we">🤵</span>HyeonWoo</button>
        <button class="who-chip" data-who="Jam"><span class="we">👰</span>Jam</button>
      </div>
      <div style="height:8px"></div>
      <button class="cta" id="startBtn" disabled></button>
    </div>
    <div class="disclaimer" id="inDisc"></div>
  </div>

  <!-- test -->
  <div class="view" id="v-test">
    <div class="card">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-num" id="progNum"></div>
      <div class="q-text" id="qText"></div>
      <div class="ans-col" id="ansCol"></div>
      <div style="display:flex; justify-content:space-between; align-items:center">
        <button class="q-back" id="qBack"></button>
        <button class="q-back" id="qNext" style="visibility:hidden"></button>
      </div>
    </div>
  </div>

  <!-- result -->
  <div class="view" id="v-result">
    <div class="card ph-card">
      <div class="sub" id="rWho"></div>
      <div class="pe" id="phEmoji"></div>
      <div class="pt" id="phType"></div>
      <div class="pn" id="phName"></div>
      <div class="pd" id="phDesc"></div>
    </div>
    <div class="card">
      <h2 id="axTitle"></h2>
      <div id="axBars"></div>
    </div>
    <div class="card" id="cmpCard" style="display:none">
      <h2 id="cmpTitle"></h2>
      <div style="height:10px"></div>
      <div id="cmpBody"></div>
    </div>
    <div class="sync-note" id="syncNote" style="display:none"></div>
    <div class="disclaimer" id="rDisc"></div>
    <button class="ghost" id="editBtn" style="width:100%; margin-bottom:10px"></button>
    <div class="btn-row">
      <button class="ghost" id="againBtn"></button>
      <button class="cta" style="flex:1" id="homeBtn"></button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = (id) => document.getElementById(id);

      const LLM_ENDPOINT = 'https://bzgjaonngg.execute-api.ap-northeast-2.amazonaws.com/';
      const SPACE = 'hj-a8f3kx92-phbti-v1';

      const LKEY = 'fortune_lang';
      // default language is ENGLISH; Korean only when explicitly chosen
      let lang = localStorage.getItem(LKEY) === 'ko' ? 'ko' : 'en';
      const t = (pair) => pair[lang === 'ko' ? 0 : 1];

      const STR = {
        inTitle: ['철학자 성격 테스트', 'The Philosopher Personality Test'],
        inSub: ['20개의 질문에 답하면 당신과 닮은<br>철학자 한 명을 찾아드려요.<br>누가 답하는지 골라주세요 🧠',
                'Answer 20 questions and meet the<br>philosopher who thinks like you.<br>First, tell me who you are 🧠'],
        start: ['생각하며 시작하기 🏛️', 'Start thinking 🏛️'],
        disc: ['재미로 보는 성격 테스트예요. 철학자 매칭은 학문적 분류가 아니라 즐거운 상상입니다.',
               'A personality test for fun — the philosopher matches are playful imagination, not scholarship.'],
        back: ['← 이전 질문', '← Previous question'],
        next: ['다음 →', 'Next →'],
        rWho: ['{w}와 닮은 철학자는', 'The philosopher who thinks like {w}'],
        axTitle: ['성향 축 분석', 'Your four axes'],
        cmpTitle: ['상대의 철학자 💞', 'Your partner’s philosopher 💞'],
        cmpNone: ['{b}의 결과가 아직 없어요. 어떤 철학자일지 궁금하지 않아요? 😏', 'No result from {b} yet. Aren’t you curious which philosopher they’d be? 😏'],
        cmpSame: ['둘이 같은 철학자예요! 영혼의 학파 동기네요 🎓', 'Same philosopher! Soulmates of the same school 🎓'],
        cmpDiff: ['{a}({ta}) × {b}({tb}) — 서로 다른 학파의 만남이에요. 오늘 저녁 토론 주제로 어떨까요?', '{a} ({ta}) × {b} ({tb}) — two schools meet. Tonight’s dinner debate, perhaps?'],
        again: ['처음부터 다시', 'Start over'],
        edit: ['✏️ 답변 수정하기 (결과 다시 계산)', '✏️ Edit my answers (recalculate)'],
        home: ['메인으로', 'Home'],
        saving: ['결과를 공유 저장소에 남기는 중…', 'Saving to your shared space…'],
        ans: [
          ['전혀 아니다', 'Strongly disagree'],
          ['아니다', 'Disagree'],
          ['보통이다', 'Neutral'],
          ['그렇다', 'Agree'],
          ['매우 그렇다', 'Strongly agree'],
        ],
        axes: {
          EI: [['외향 E', 'Extraverted E'], ['내향 I', 'Introverted I']],
          NS: [['직관 N', 'Intuitive N'], ['현실 S', 'Observant S']],
          TF: [['사고 T', 'Thinking T'], ['감정 F', 'Feeling F']],
          JP: [['계획 J', 'Judging J'], ['유연 P', 'Prospecting P']],
        },
      };

      /* ═══ questions — 5 per axis, agreeing leans to the FIRST pole ═══ */
      const Q = [
        ['생각은 혼자 정리하기보다 소리 내어 말하면서 정리된다.', 'I sort out my thoughts by talking, not by brooding alone.', 'EI'],
        ['여럿이 떠드는 토론에서 오히려 에너지를 얻는다.', 'Lively group debates actually energize me.', 'EI'],
        ['처음 보는 사람에게도 스스럼없이 질문을 던지는 편이다.', 'I’ll happily throw questions at people I’ve just met.', 'EI'],
        ['조용한 서재보다 시끌벅적한 광장이 더 어울린다.', 'The busy public square suits me better than a quiet study.', 'EI'],
        ['하루 종일 혼자 있으면 기운이 빠진다.', 'A whole day alone drains my battery.', 'EI'],
        ['"그래서 본질이 뭔데?"라는 질문을 자주 한다.', 'I keep asking “but what’s the essence of it?”', 'NS'],
        ['눈앞의 사실보다 그 뒤에 숨은 의미와 패턴이 더 궁금하다.', 'The meanings and patterns behind facts interest me more than the facts.', 'NS'],
        ['공상과 사고실험으로 시간 가는 줄 모른다.', 'I happily lose track of time in daydreams and thought experiments.', 'NS'],
        ['설명서를 읽기 전에 일단 큰 그림부터 그려본다.', 'I sketch the big picture before I ever read the manual.', 'NS'],
        ['"만약에…"로 시작하는 대화를 사랑한다.', 'I love conversations that start with “what if…”.', 'NS'],
        ['위로보다 해결책을 먼저 말하는 편이다.', 'I tend to offer solutions before comfort.', 'TF'],
        ['논리가 어긋나면 상대가 누구든 지적하고 싶어진다.', 'When the logic breaks, I itch to point it out — whoever said it.', 'TF'],
        ['결정할 때 마음이 가는 쪽보다 근거가 있는 쪽을 고른다.', 'When deciding, I pick the side with reasons over the side with feelings.', 'TF'],
        ['"그건 좀 비합리적이야"라는 말을 자주 쓴다.', '“That’s a bit irrational” is a phrase I use a lot.', 'TF'],
        ['다정한 거짓말보다 불편한 진실이 낫다.', 'An uncomfortable truth beats a kind lie.', 'TF'],
        ['계획이 정해져야 비로소 마음이 편해진다.', 'I only relax once the plan is set.', 'JP'],
        ['마감보다 훨씬 전에 끝내둬야 안심이 된다.', 'I need things finished well before the deadline to feel safe.', 'JP'],
        ['여행은 일정표부터 짜고 시작한다.', 'Every trip starts with an itinerary.', 'JP'],
        ['책상과 폴더가 정리되어 있어야 생각도 정리된다.', 'A tidy desk and tidy folders make for a tidy mind.', 'JP'],
        ['갑작스러운 계획 변경은 스트레스다.', 'Last-minute changes stress me out.', 'JP'],
      ];

      /* ═══ 16 philosophers ═══ */
      const PH = {
        ISTJ: { e: '📐', n: ['아리스토텔레스', 'Aristotle'],
          d: ['관찰하고, 분류하고, 검증하는 체계의 건축가예요. 화려한 이상보다 반복 가능한 습관과 중용의 균형을 믿습니다. 세상 모든 것에 제자리를 찾아주는 사람이에요.',
              'An architect of systems — observing, sorting, verifying. You trust repeatable habits and the golden mean over grand ideals, and you find everything its proper place.'] },
        ISFJ: { e: '⛪', n: ['토마스 아퀴나스', 'Thomas Aquinas'],
          d: ['믿는 것을 조용히, 성실하게 지켜내는 수호자예요. 이성과 신념이 부딪힐 때 둘을 화해시키는 드문 재능이 있습니다. 곁에 있으면 이상하게 마음이 놓이는 사람이에요.',
              'A quiet, faithful guardian of what you believe in, with a rare gift for reconciling reason and conviction. People feel oddly safe around you.'] },
        INFJ: { e: '🏛️', n: ['플라톤', 'Plato'],
          d: ['눈앞의 세계 너머 완벽한 이데아를 그리는 이상주의자예요. 현실이 흔들려도 마음속 설계도는 늘 선명합니다. 동굴 밖의 빛을 본 사람은 다시 안으로 걸어 들어가 알려주는 법이죠.',
              'An idealist sketching the perfect world beyond this one. Reality may wobble, but your inner blueprint never does — and having seen the light outside the cave, you walk back in to tell the others.'] },
        INTJ: { e: '⚡', n: ['니체', 'Nietzsche'],
          d: ['낡은 가치를 부수고 자기만의 가치를 세우는 망치의 철학자예요. 군중의 박수보다 자기 확신을 따르고, 심연을 오래 들여다볼 용기가 있습니다.',
              'A philosopher with a hammer, breaking stale values to forge your own. You follow conviction over applause, with the nerve to stare long into the abyss.'] },
        ISTP: { e: '🔧', n: ['비트겐슈타인', 'Wittgenstein'],
          d: ['말과 도구를 정밀하게 다루는 조용한 장인이에요. 문제의 매듭을 손끝으로 풀어내고, 말할 수 없는 것 앞에서는 깔끔하게 침묵을 택합니다.',
              'A quiet craftsman of words and tools. You untangle problems with your fingertips — and where nothing true can be said, you neatly choose silence.'] },
        ISFP: { e: '🍇', n: ['에피쿠로스', 'Epicurus'],
          d: ['소박한 정원에서 좋은 친구, 좋은 음식이면 충분한 사람이에요. 요란한 성공보다 잔잔한 즐거움을 가꾸고, 불안을 걷어낸 자리에 평온을 심습니다.',
              'A garden soul — good friends and simple food are plenty. You tend calm pleasures over loud success, planting peace where anxiety used to grow.'] },
        INFP: { e: '🌿', n: ['루소', 'Rousseau'],
          d: ['자연과 순수를 그리워하는 몽상가예요. 세상이 만든 규칙보다 마음속의 선함을 믿고, 잃어버린 것들을 글과 상상으로 되살립니다.',
              'A dreamer longing for nature and innocence. You trust the goodness within over the rules without, reviving lost things through words and imagination.'] },
        INTP: { e: '🕰️', n: ['칸트', 'Kant'],
          d: ['산책 시간까지 정확했다는 사유의 시계공이에요. 머릿속에 우주를 짓고 그 법칙을 끝까지 파고들며, 밤하늘의 별과 마음속 법칙에 같이 설레는 사람입니다.',
              'A clockmaker of thought, precise down to the daily walk. You build universes in your head and chase their laws to the end — thrilled equally by starry skies above and the law within.'] },
        ESTP: { e: '🏺', n: ['디오게네스', 'Diogenes'],
          d: ['황제 앞에서도 "햇빛이나 가리지 마시오"라고 말할 수 있는 거리의 도발자예요. 이론보다 몸으로 부딪히며 진실을 시험하고, 허세를 한 방에 꿰뚫어봅니다.',
              'A street provocateur who’d tell an emperor to stop blocking the sun. You test truth by living it out loud, and you puncture pretension in one line.'] },
        ESFP: { e: '🎲', n: ['흄', 'David Hume'],
          d: ['유쾌한 저녁 식탁의 회의주의자예요. 무거운 이론도 좋은 친구와 한 끼 앞에서는 가볍게 내려놓을 줄 알고, 그 여유가 오히려 깊은 통찰이 됩니다.',
              'The cheerful skeptic of the dinner table. You know when to set heavy theories down beside good company — and that ease is its own deep insight.'] },
        ENFP: { e: '🦋', n: ['장자', 'Zhuangzi'],
          d: ['나비 꿈과 현실 사이를 자유롭게 넘나드는 바람 같은 사람이에요. 쓸모없어 보이는 것들의 쓸모를 알아보고, 정해진 길 대신 물 흐르듯 자기 길을 냅니다.',
              'Free as wind between butterfly dreams and waking life. You see the usefulness of “useless” things and carve your path the way water does — by flowing.'] },
        ENTP: { e: '🗣️', n: ['소크라테스', 'Socrates'],
          d: ['질문으로 상대의 확신을 살살 무너뜨리는 광장의 산파예요. "너 자신을 알라"를 온몸으로 실천하며, 논쟁이 곧 애정 표현인 사람입니다.',
              'The midwife of the agora, gently dismantling certainties with questions. “Know thyself” is your way of life — and debating you is how you show love.'] },
        ESTJ: { e: '⚖️', n: ['한비자', 'Han Feizi'],
          d: ['원칙과 시스템으로 세상이 굴러가게 만드는 현실주의자예요. 착한 말보다 잘 설계된 규칙을 믿고, 애매함을 정리해 모두가 움직일 수 있게 만듭니다.',
              'A realist who keeps the world running on principle and system. You trust well-built rules over nice words, clearing ambiguity so everyone can move.'] },
        ESFJ: { e: '🏮', n: ['공자', 'Confucius'],
          d: ['관계를 지탱하는 예(禮)와 온기를 아는 사람이에요. 좋은 공동체는 좋은 마음에서 시작된다고 믿고, 바라는 세상을 먼저 몸소 보여줍니다.',
              'You know the warmth and ritual that hold people together. Believing good communities begin with good hearts, you model the world you wish for.'] },
        ENFJ: { e: '🕊️', n: ['시몬 드 보부아르', 'Simone de Beauvoir'],
          d: ['곁의 사람들이 스스로 자유로워지도록 이끄는 실존주의자예요. 사랑도 자유도 완성된 채 주어지는 게 아니라 함께 만들어가는 것이라 믿습니다.',
              'An existentialist who leads others toward their own freedom, believing neither love nor liberty is handed to us finished — we build them together.'] },
        ENTJ: { e: '🦁', n: ['마키아벨리', 'Machiavelli'],
          d: ['목표가 정해지면 길을 설계하고 끝까지 밀어붙이는 전략가예요. 이상만큼 수단의 현실도 냉정하게 보며, 운명의 절반은 실력으로 바꿀 수 있다고 믿습니다.',
              'A strategist who charts the road and drives it through. You see means as clearly as ends — and believe half of fortune yields to skill.'] },
      };

      /* ═══ state ═══ */
      let who = null;
      let idx = 0;
      const answers = new Array(Q.length).fill(null);
      let myEntry = null;

      const VIEWS = ['v-intro', 'v-test', 'v-result'];
      function show(v) { VIEWS.forEach(x => $(x).classList.toggle('on', x === v)); window.scrollTo(0, 0); }

      async function histApi(kind, payload) {
        if (!LLM_ENDPOINT) return null;
        try {
          const r = await fetch(LLM_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind, payload: { space: SPACE, ...payload } }),
          });
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }

      function renderIntro() {
        $('inTitle').textContent = t(STR.inTitle);
        $('inSub').innerHTML = t(STR.inSub);
        $('startBtn').textContent = t(STR.start);
        $('inDisc').textContent = t(STR.disc);
        $('langBtn').textContent = lang === 'ko' ? 'EN' : '한';
        document.documentElement.lang = lang;
      }

      function renderQuestion() {
        const q = Q[idx];
        $('progFill').style.width = (idx / Q.length * 100) + '%';
        $('progNum').textContent = (idx + 1) + ' / ' + Q.length;
        $('qText').textContent = (idx + 1) + '. ' + (lang === 'ko' ? q[0] : q[1]);
        $('qBack').textContent = t(STR.back);
        $('qBack').style.visibility = idx > 0 ? 'visible' : 'hidden';
        $('qNext').textContent = t(STR.next);
        $('qNext').style.visibility = answers[idx] !== null ? 'visible' : 'hidden';
        const col = $('ansCol');
        col.innerHTML = '';
        col.dataset.lock = '';
        STR.ans.forEach((label, v) => {
          const b = document.createElement('button');
          b.className = 'ans-btn' + (answers[idx] === v ? ' sel' : '');
          b.textContent = t(label);
          b.addEventListener('click', () => {
            if (col.dataset.lock) return;
            col.dataset.lock = '1';
            answers[idx] = v;
            b.classList.add('sel');
            setTimeout(() => {
              if (idx < Q.length - 1) { idx++; renderQuestion(); }
              else finish();
            }, 160);
          });
          col.appendChild(b);
        });
      }

      /* axis % toward the first pole (E/N/T/J); >=50 wins the first letter */
      function computeAxes(ans) {
        const sum = { EI: 0, NS: 0, TF: 0, JP: 0 };
        const cnt = { EI: 0, NS: 0, TF: 0, JP: 0 };
        Q.forEach((q, i) => {
          if (ans[i] === null || ans[i] === undefined) return;
          sum[q[2]] += ans[i];
          cnt[q[2]] += 4;
        });
        const axes = {};
        Object.keys(sum).forEach(k => { axes[k] = cnt[k] ? Math.round(sum[k] / cnt[k] * 100) : 50; });
        return axes;
      }
      function lettersOf(axes) {
        return (axes.EI >= 50 ? 'E' : 'I') + (axes.NS >= 50 ? 'N' : 'S')
          + (axes.TF >= 50 ? 'T' : 'F') + (axes.JP >= 50 ? 'J' : 'P');
      }

      let finishing = false;
      async function finish() {
        if (finishing) return;
        finishing = true;
        const axes = computeAxes(answers);
        const letters = lettersOf(axes);
        if (myEntry) {
          myEntry.axes = axes;
          myEntry.letters = letters; // edited: recalc, keep ts (server upserts)
        } else {
          myEntry = { type: 'phbti', ts: Date.now(), who, axes, letters };
        }
        renderResult(myEntry);
        show('v-result');
        $('syncNote').textContent = t(STR.saving);
        $('syncNote').style.display = 'block';
        await histApi('hist_put', { entry: myEntry });
        await renderCompare();
        $('syncNote').style.display = 'none';
        finishing = false;
      }

      function renderResult(entry) {
        const ph = PH[entry.letters];
        $('rWho').textContent = t(STR.rWho).replace('{w}', entry.who);
        $('phEmoji').textContent = ph.e;
        $('phType').textContent = entry.letters;
        $('phName').textContent = t(ph.n);
        $('phDesc').textContent = t(ph.d);
        $('axTitle').textContent = t(STR.axTitle);
        $('rDisc').textContent = t(STR.disc);
        $('editBtn').textContent = t(STR.edit);
        $('againBtn').textContent = t(STR.again);
        $('homeBtn').textContent = t(STR.home);
        $('axBars').innerHTML = Object.keys(STR.axes).map(k => {
          const pct = entry.axes[k];
          const first = pct >= 50;
          return '<div class="axis-row">'
            + '<div class="axis-head">'
            + '<span class="' + (first ? 'w' : 'l') + '">' + t(STR.axes[k][0]) + ' ' + pct + '%</span>'
            + '<span class="' + (first ? 'l' : 'w') + '">' + (100 - pct) + '% ' + t(STR.axes[k][1]) + '</span>'
            + '</div>'
            + '<div class="axis-track"><span class="axis-fill" data-w="' + pct + '"></span></div>'
            + '</div>';
        }).join('');
        requestAnimationFrame(() => {
          document.querySelectorAll('#axBars .axis-fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
        });
      }

      async function renderCompare() {
        if (!myEntry) return;
        const other = myEntry.who === 'HyeonWoo' ? 'Jam' : 'HyeonWoo';
        $('cmpCard').style.display = 'block';
        $('cmpTitle').textContent = t(STR.cmpTitle);
        const body = await histApi('hist_list', {});
        const theirs = body && Array.isArray(body.items)
          ? body.items.find(e => e.type === 'phbti' && e.who === other) : null;
        if (!theirs) {
          $('cmpBody').innerHTML = '<div class="cmp-note">' + t(STR.cmpNone).replace('{b}', other) + '</div>';
          return;
        }
        const ph = PH[theirs.letters];
        let html = '<div class="cmp-box">'
          + '<span class="ce">' + ph.e + '</span>'
          + '<span><div class="cn">' + other + ' — ' + t(ph.n) + ' (' + theirs.letters + ')</div>'
          + '<div class="cd">' + t(ph.d) + '</div></span></div>';
        html += '<div class="cmp-note">' + (theirs.letters === myEntry.letters
          ? t(STR.cmpSame)
          : t(STR.cmpDiff).replace('{a}', t(PH[myEntry.letters].n)).replace('{ta}', myEntry.letters)
              .replace('{b}', t(ph.n)).replace('{tb}', theirs.letters)) + '</div>';
        $('cmpBody').innerHTML = html;
      }

      /* ═══ events ═══ */
      document.querySelectorAll('.who-chip').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.who-chip').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          who = b.dataset.who;
          $('startBtn').disabled = false;
        });
      });

      $('startBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        renderQuestion();
        show('v-test');
      });

      $('qBack').addEventListener('click', () => {
        if (idx > 0) { idx--; renderQuestion(); }
      });
      $('qNext').addEventListener('click', () => {
        if (answers[idx] === null) return;
        if (idx < Q.length - 1) { idx++; renderQuestion(); }
        else finish();
      });

      /* revisit questions with previous answers preselected; finishing again
         recalculates and overwrites the same shared entry */
      $('editBtn').addEventListener('click', () => {
        idx = 0;
        renderQuestion();
        show('v-test');
      });

      $('againBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        myEntry = null;
        renderIntro();
        show('v-intro');
      });
      $('homeBtn').addEventListener('click', () => { location.href = './index.html'; });

      $('langBtn').addEventListener('click', () => {
        lang = lang === 'ko' ? 'en' : 'ko';
        localStorage.setItem(LKEY, lang);
        renderIntro();
        if ($('v-test').classList.contains('on')) renderQuestion();
        if ($('v-result').classList.contains('on') && myEntry) { renderResult(myEntry); renderCompare(); }
      });

      renderIntro();
    })();
  </script>
</body>
</html>
