  </style>

        ['둘만의 규칙을 정해두고, 어기면 벌을 주는 쪽이 어울린다.', 'Setting rules for us — and punishing broken ones — suits me.', { dom: 1, tamer: 1, sadist: 1 }],
        ['규칙을 어기고 벌 받는 상황을 상상하면 두근거린다.', 'Imagining breaking a rule and taking my punishment thrills me.', { sub: 1, brat: 1, maso: 1 }],
        ['플레이 중 상대의 머리를 쓰다듬으며 "착하지"라고 말해주고 싶다.', 'Mid-play, I want to stroke my partner’s hair and tell them they’re good.', { dom: 2, tamer: 1 }],
        ['아무 생각 없이 완전히 맡겨버리고 싶은 날이 있다.', 'Some days I just want to switch my brain off and be completely taken.', { sub: 2 }],
        ['선생님/학생, 주인/메이드 같은 역할극을 해보고 싶다.', 'I’d like to try roleplay — teacher/student, master/maid.', { expl: 2, switch: 1 }],
        ['상대를 감질나게 애태우다가 결국 애원하게 만들고 싶다.', 'I want to tease my partner to the edge until they beg.', { dom: 2, sadist: 1 }],
        ['애원해야 하는 상황이 부끄럽지만 흥분된다.', 'Having to beg embarrasses me — and turns me on.', { sub: 2, maso: 1 }],
        ['머리카락을 잡아당기거나 목덜미를 쥐는 쪽에 끌린다.', 'I’m drawn to pulling hair or gripping the back of a neck.', { sadist: 2, dom: 1 }],
        ['머리카락을 잡히거나 목덜미를 쥐이는 쪽에 끌린다.', 'Having my hair pulled or my neck gripped draws me in.', { maso: 2, sub: 1 }],
        ['거울이나 카메라 앞에서 하는 상상을 해본 적이 있다.', 'I’ve fantasized about doing it in front of a mirror or a camera.', { exhib: 2, voyeur: 1 }],
        ['쫓고 붙잡고 가볍게 제압하는 몸싸움 같은 플레이에 끌린다.', 'Chase-and-pin play — hunting or being hunted — appeals to me.', { dom: 1, brat: 1, expl: 1 }],
        ['세이프워드를 정해두면 훨씬 과감하게 시도해볼 수 있을 것 같다.', 'With a safeword agreed, I could get much bolder.', { expl: 2, switch: 1 }],
        ['손목을 머리 위로 고정하거나 고정당하는 순간이 좋다.', 'That moment of wrists pinned overhead — giving or getting — is delicious.', { rigger: 1, bunny: 1, switch: 1 }],
        ['격한 플레이 후 꼭 안아주고 도닥이는 애프터케어가 꼭 필요하다.', 'After intense play, holding each other close — real aftercare — is a must.', { vanilla: 2, sub: 1 }],
      ];

      /* ═══ state ═══ */
      let who = null;
      let idx = 0;
      const answers = new Array(Q.length).fill(null);
      let myEntry = null;

      /* ═══ views ═══ */
      const VIEWS = ['v-intro', 'v-test', 'v-result'];
      function show(v) { VIEWS.forEach(x => $(x).classList.toggle('on', x === v)); window.scrollTo(0, 0); }

      /* ═══ shared store ═══ */
      async function histApi(kind, payload) {
        if (!LLM_ENDPOINT) return null;
        try {
          const r = await fetch(LLM_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind, payload: { space: SPACE, ...payload } }),
          });
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }

      /* ═══ rendering ═══ */
      function renderIntro() {
        $('inTitle').textContent = t(STR.inTitle);
        $('inSub').innerHTML = t(STR.inSub);
        $('startBtn').textContent = t(STR.start);
        $('inDisc').textContent = t(STR.disc);
        $('langBtn').textContent = lang === 'ko' ? 'EN' : '한';
        document.documentElement.lang = lang;
      }

      function renderQuestion() {
        const q = Q[idx];
        $('progFill').style.width = ((idx) / Q.length * 100) + '%';
        $('progNum').textContent = (idx + 1) + ' / ' + Q.length;
        $('qText').textContent = (idx + 1) + '. ' + (lang === 'ko' ? q[0] : q[1]);
        $('qBack').textContent = t(STR.back);
        $('qBack').style.visibility = idx > 0 ? 'visible' : 'hidden';
        const col = $('ansCol');
        col.innerHTML = '';
        STR.ans.forEach((label, v) => {
          const b = document.createElement('button');
          b.className = 'ans-btn' + (answers[idx] === v ? ' sel' : '');
          b.textContent = t(label);
          b.addEventListener('click', () => {
            answers[idx] = v;
            b.classList.add('sel');
            setTimeout(() => {
              if (idx < Q.length - 1) { idx++; renderQuestion(); }
              else finish();
            }, 160);
          });
          col.appendChild(b);
        });
      }

      function computeScores(ans) {
        const num = {}, den = {};
        ARCH.forEach(a => { num[a.k] = 0; den[a.k] = 0; });
        Q.forEach((q, i) => {
          const v = ans[i];
          if (v === null || v === undefined) return;
          Object.entries(q[2]).forEach(([k, w]) => {
            num[k] += v * w;
            den[k] += 4 * w;
          });
        });
        const scores = {};
        ARCH.forEach(a => { scores[a.k] = den[a.k] ? Math.round(num[a.k] / den[a.k] * 100) : 0; });
        return scores;
      }

      async function finish() {
        const scores = computeScores(answers);
        myEntry = { type: 'bdsm', ts: Date.now(), who, scores };
        renderResult(myEntry);
        show('v-result');
        // save to the shared store, then look up the partner's latest result
        $('syncNote').textContent = t(STR.saving);
        $('syncNote').style.display = 'block';
        await histApi('hist_put', { entry: myEntry });
        await renderCompare();
        $('syncNote').style.display = 'none';
      }

      function barRow(a, pct) {
        return '<div class="rbar-row">'
          + '<span class="rn">' + a.e + ' ' + t(a.n) + '</span>'
          + '<span class="rt"><span class="rf" data-w="' + pct + '" style="background:' + a.c + '"></span></span>'
          + '<span class="rp">' + pct + '%</span></div>';
      }

      function renderResult(entry) {
        const sorted = ARCH.map(a => ({ a, p: entry.scores[a.k] || 0 })).sort((x, y) => y.p - x.p);
        $('rTitle').textContent = t(STR.rTitle).replace('{w}', entry.who);
        $('rSub').textContent = t(STR.rSub);
        $('rAllTitle').textContent = t(STR.rAll);
        $('rDisc').textContent = t(STR.disc);
        $('againBtn').textContent = t(STR.again);
        $('homeBtn').textContent = t(STR.home);
        $('rTop3').innerHTML = sorted.slice(0, 3).map((x, i) =>
          '<div class="arch-card' + (i === 0 ? ' rank1' : '') + '">'
          + '<span class="ae">' + x.a.e + '</span>'
          + '<span style="flex:1"><div class="an">' + t(x.a.n) + '</div><div class="ad">' + t(x.a.d) + '</div></span>'
          + '<span class="ap" style="color:' + x.a.c + '">' + x.p + '%</span></div>'
        ).join('');
        $('rBars').innerHTML = sorted.map(x => barRow(x.a, x.p)).join('');
        requestAnimationFrame(() => {
          document.querySelectorAll('#rBars .rf').forEach(f => { f.style.width = f.dataset.w + '%'; });
        });
      }

      async function renderCompare() {
        if (!myEntry) return;
        const other = myEntry.who === 'HyeonWoo' ? 'Jam' : 'HyeonWoo';
        $('cmpCard').style.display = 'block';
        $('cmpTitle').textContent = t(STR.cmpTitle);
        const body = await histApi('hist_list', {});
        const theirs = body && Array.isArray(body.items)
          ? body.items.find(e => e.type === 'bdsm' && e.who === other) : null;
        if (!theirs) {
          $('cmpSub').textContent = '';
          $('cmpBody').innerHTML = '<div class="cmp-note">' + t(STR.cmpNone).replace('{b}', other) + '</div>';
          return;
        }
        $('cmpSub').textContent = t(STR.cmpSub).replace('{a}', myEntry.who).replace('{b}', theirs.who);
        const sorted = ARCH.map(a => ({
          a,
          me: myEntry.scores[a.k] || 0,
          you: theirs.scores[a.k] || 0,
        })).sort((x, y) => Math.max(y.me, y.you) - Math.max(x.me, x.you));
        let html = '<div class="cmp-head"><span style="color:#e0708f">■ ' + myEntry.who + '</span>'
          + '<span style="color:#6a93c4">■ ' + theirs.who + '</span></div>';
        html += sorted.map(x =>
          '<div class="cmp-row"><div class="cn">' + x.a.e + ' ' + t(x.a.n) + ' · ' + x.me + '% / ' + x.you + '%</div>'
          + '<div class="cmp-bars">'
          + '<span class="ct"><span class="cf me" style="width:' + x.me + '%"></span></span>'
          + '<span class="ct"><span class="cf you" style="width:' + x.you + '%"></span></span>'
          + '</div></div>'
        ).join('');
        // both high (>=60) → talking points; complementary pairs → matches
        const both = sorted.filter(x => x.me >= 60 && x.you >= 60).map(x => x.a.e + t(x.a.n));
        const PAIRS = [['dom', 'sub'], ['sadist', 'maso'], ['rigger', 'bunny'], ['brat', 'tamer'], ['exhib', 'voyeur']];
        const fits = [];
        PAIRS.forEach(([p, q]) => {
          const A = AK[p], B = AK[q];
          if ((myEntry.scores[p] >= 60 && theirs.scores[q] >= 60)) fits.push(A.e + t(A.n) + ' ↔ ' + B.e + t(B.n));
          else if ((myEntry.scores[q] >= 60 && theirs.scores[p] >= 60)) fits.push(B.e + t(B.n) + ' ↔ ' + A.e + t(A.n));
        });
        if (both.length) html += '<div class="cmp-note">' + t(STR.cmpHot).replace('{list}', both.join(', ')) + '</div>';
        if (fits.length) html += '<div class="cmp-note">' + t(STR.cmpFit).replace('{list}', fits.join(' · ')) + '</div>';
        $('cmpBody').innerHTML = html;
      }

      /* ═══ events ═══ */
      document.querySelectorAll('.who-chip').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.who-chip').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          who = b.dataset.who;
          $('startBtn').disabled = false;
        });
      });

      $('startBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        renderQuestion();
        show('v-test');
      });

      $('qBack').addEventListener('click', () => {
        if (idx > 0) { idx--; renderQuestion(); }
      });

      $('againBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        myEntry = null;
        renderIntro();
        show('v-intro');
      });
      $('homeBtn').addEventListener('click', () => { location.href = './index.html'; });

      $('langBtn').addEventListener('click', () => {
        lang = lang === 'ko' ? 'en' : 'ko';
        localStorage.setItem(LKEY, lang);
        renderIntro();
        if ($('v-test').classList.contains('on')) renderQuestion();
        if ($('v-result').classList.contains('on') && myEntry) { renderResult(myEntry); renderCompare(); }
      });

      /* init */
      renderIntro();
    })();
  </script>
</body>
</html>
