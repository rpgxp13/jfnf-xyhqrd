      font-weight: 700;
      color: #6b4a3a;
      cursor: pointer;

      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(135deg, #ef8fae, #ffb98a);
      color: #5c3030;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(230, 100, 130, 0.35);

    .ghost {

      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.8);
      color: #6b4a3a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;

      background: #fdf1e9;
      font-family: inherit;

      border-radius: 14px;
      padding: 13px 16px;
      background: #fdf1e9;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      color: #6b4a3a;
      cursor: pointer;
      text-align: left;

    .ans-btn.sel { border-color: #ef8fae; background: #ffe9f0; }

    .cmp-note { font-size: 12px; color: #a08a75; margin-top: 10px; line-height: 1.6; }

    .sync-note { font-size: 12px; color: #b0a08a; font-weight: 600; text-align: center; margin: 4px 0 10px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  </style>
</head>

        show('v-result');
        renderCompare();
      }

      /* ═══ events ═══ */
      document.querySelectorAll('.who-chip').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.who-chip').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          who = b.dataset.who;
          localStorage.setItem(WHO_KEY, who);
          $('startBtn').disabled = false;
          if (suppressAuto) return;
          $('introSync').textContent = t(STR.checking);
          $('introSync').style.display = 'block';
          loadExisting(who).then(e => {
            $('introSync').style.display = 'none';
            if (e && who === b.dataset.who && $('v-intro').classList.contains('on')) openEntry(e);
          });
        });
      });

      $('startBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        renderQuestion();
        show('v-test');
      });

      $('qBack').addEventListener('click', () => {
        if (idx > 0) { idx--; renderQuestion(); }
      });
      $('qNext').addEventListener('click', () => {
        if (answers[idx] === null) return;
        if (idx < Q.length - 1) { idx++; renderQuestion(); }
        else finish();
      });

      /* revisit the questions with previous answers preselected; finishing
         again recalculates and overwrites the same shared entry */
      $('editBtn').addEventListener('click', () => {
        idx = 0;
        renderQuestion();
        show('v-test');
      });

      $('againBtn').addEventListener('click', () => {
        idx = 0;
        answers.fill(null);
        myEntry = null;
        suppressAuto = true; // deliberate restart: don't bounce back to the old result
        renderIntro();
        show('v-intro');
      });
      $('homeBtn').addEventListener('click', () => { location.href = './index.html'; });

      $('langBtn').addEventListener('click', () => {
        lang = lang === 'ko' ? 'en' : 'ko';
        localStorage.setItem(LKEY, lang);
        renderIntro();
        if ($('v-test').classList.contains('on')) renderQuestion();
        if ($('v-result').classList.contains('on') && myEntry) { renderResult(myEntry); renderCompare(); }
      });

      /* init — remember who used this device and reopen their result */
      renderIntro();
      const savedWho = localStorage.getItem(WHO_KEY);
      if (savedWho) {
        const chip = document.querySelector('.who-chip[data-who="' + savedWho + '"]');
        if (chip) chip.click();
      }
    })();
  </script>
</body>
</html>
