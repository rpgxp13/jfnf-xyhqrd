<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>HyeonWoo 🤍 Jam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #bfe3f2 0%, #dff2ec 55%, #f6ecd9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      min-height: 100vh;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #5a4632;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .dday {
      display: flex;
      align-items: baseline;
      gap: 7px;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 16px;
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(230, 120, 150, 0.2);
      margin: 4px 0 10px;
    }
    .dday .num {
      font-size: 16px;
      font-weight: 800;
      color: #e0708f;
    }
    .dday .since {
      font-size: 11px;
      font-weight: 600;
      color: #8a7a63;
    }

    .subtitle {
      font-size: 13px;
      color: #8a7a63;
      margin-bottom: 18px;
    }

    /* ── Player card ─────────────────── */
    .player {
      position: relative;
      width: min(92vw, 440px);
      border-radius: 22px;
      overflow: hidden;
      background: #fdf6e9;
      box-shadow: 0 10px 30px rgba(90, 70, 50, 0.18);
      cursor: pointer;
    }
    .player video, .player .base-img {
      display: block;
      width: 100%;
      background: #fdf6e9;
    }
    .player video.hidden, .player .base-img.hidden { display: none; }

    /* Overlay (start hint / loading / replay) */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 26px;
      gap: 10px;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .overlay.hidden { opacity: 0; }
    .overlay.dimmed {
      justify-content: center;
      padding-bottom: 0;
      background: rgba(253, 246, 233, 0.55);
      backdrop-filter: blur(2px);
    }
    .overlay .big { font-size: 44px; animation: bob 1.6s ease-in-out infinite; }
    .overlay .msg {
      font-size: 15px;
      font-weight: 600;
      color: #5a4632;
      background: rgba(255, 255, 255, 0.88);
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(90, 70, 50, 0.15);
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(90, 70, 50, 0.15);
      border-top-color: #e8a955;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Floating hearts over the idle image */
    .idle-heart {
      position: absolute;
      bottom: 8%;
      font-size: 22px;
      pointer-events: none;
      animation: rise 3s ease-out forwards;
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-260px) scale(1.15) rotate(12deg); }
    }

    /* Status line */
    .status {
      margin: 14px 0 10px;
      font-size: 15px;
      font-weight: 600;
      color: #5a4632;
      min-height: 22px;
      transition: opacity 0.2s;
    }

    /* ── Motion buttons ─────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(92vw, 440px);
    }
    .grid button {
      appearance: none;
      border: none;
      border-radius: 16px;
      padding: 12px 4px 10px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 3px 10px rgba(90, 70, 50, 0.10);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #5a4632;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .grid button .emoji { font-size: 26px; }
    .grid button:active { transform: scale(0.93); }
    .grid button.playing {
      background: #ffe3ea;
      box-shadow: 0 3px 12px rgba(230, 120, 150, 0.35);
      transform: scale(1.04);
    }

    .random-btn {
      margin-top: 12px;
      width: min(92vw, 440px);
      border: none;
      border-radius: 16px;
      padding: 13px;
      background: linear-gradient(135deg, #ffb6c9, #ffd9a0);
      color: #6b4a3a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(230, 120, 150, 0.3);
      transition: transform 0.12s ease;
    }
    .random-btn:active { transform: scale(0.96); }

    .quiz-btn {
      display: block;
      margin-top: 10px;
      width: min(92vw, 440px);
      text-align: center;
      text-decoration: none;
      border-radius: 16px;
      padding: 13px;
      background: rgba(255, 255, 255, 0.75);
      color: #6b4a3a;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(90, 70, 50, 0.10);
      transition: transform 0.12s ease;
    }
    .quiz-btn:active { transform: scale(0.96); }

    /* Tap particles */
    .particle {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 20;
      animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, 0) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -110px) scale(1.2) rotate(15deg); }
    }
  </style>
</head>
<body>
  <div class="title">HyeonWoo 🤍 Jam</div>
  <div class="dday">
    <span class="num" id="ddayNum">D+1</span>
    <span class="since">since 2026.07.28</span>
  </div>
  <div class="subtitle">Press a button and watch us move</div>

  <div class="player" id="player">
    <img class="base-img" id="baseImg" src="../images/base.png" alt="">
    <video id="video" class="hidden" playsinline muted preload="metadata"></video>
    <div class="overlay" id="overlay">
      <div class="msg" id="ovMsg">Try the buttons below! 💕</div>
    </div>
  </div>

  <div class="status" id="status">&nbsp;</div>

  <div class="grid" id="grid"></div>

  <button class="random-btn" id="randomBtn">🎲 Surprise me!</button>

  <a class="quiz-btn" href="./quiz.html">💘 Love Quiz — can you pass?</a>

  <a class="quiz-btn" href="./fortune.html">🔮 Fortune — Saju &amp; Tarot</a>

  <script>
    // D-day counter: 2026-07-28 counts as D+1
    (function () {
      const start = new Date(2026, 6, 28);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((today - start) / 86400000) + 1;
      document.getElementById('ddayNum').textContent = 'D+' + days;
    })();

    const MOTIONS = [
      { file: '1_hug.mp4',     emoji: '🤗', label: 'Hug',         playing: 'Hugging tight…' },
      { file: '2_bite.mp4',    emoji: '😬', label: 'Chomp!',      playing: 'Nom nom nom…' },
      { file: '3_miss.mp4',    emoji: '💭', label: 'Missing you', playing: 'Thinking of each other…' },
      { file: '4_message.mp4', emoji: '📱', label: 'Happy feet',  playing: 'Got a message — happy feet!' },
      { file: '5_comfort.mp4', emoji: '🥺', label: 'There there', playing: 'Pat pat, it’s okay…' },
      { file: '6_call.mp4',    emoji: '📞', label: 'Video call',  playing: 'On a video call…' },
      { file: '7_lift.mp4',    emoji: '🙌', label: 'Lift up!',    playing: 'Up you go…' },
      { file: '8_photo.mp4',   emoji: '📸', label: 'Say cheese',  playing: 'Taking your photo…' },
      { file: '9_kiss.mp4',    emoji: '💋', label: 'Kiss',        playing: 'Smooch… 💕' },
    ];
    const VIDEO_DIR = '../videos/';

    const video = document.getElementById('video');
    const baseImg = document.getElementById('baseImg');
    const overlay = document.getElementById('overlay');
    const ovMsg = document.getElementById('ovMsg');
    const status = document.getElementById('status');
    const grid = document.getElementById('grid');
    const player = document.getElementById('player');
    const randomBtn = document.getElementById('randomBtn');

    let current = null;
    let loadingTimer = null;
    let heartTimer = null;

    // Build motion buttons
    MOTIONS.forEach((m, i) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="emoji">${m.emoji}</span><span>${m.label}</span>`;
      b.addEventListener('click', (e) => {
        play(i);
        spawnParticles(e.clientX, e.clientY);
      });
      grid.appendChild(b);
      m.btn = b;
    });

    // Floating hearts over the idle image
    function startIdleHearts() {
      stopIdleHearts();
      heartTimer = setInterval(() => {
        if (document.hidden) return;
        const pool = ['💕', '💗', '🤍', '💛', '✨'];
        const h = document.createElement('span');
        h.className = 'idle-heart';
        h.textContent = pool[Math.floor(Math.random() * pool.length)];
        h.style.left = (8 + Math.random() * 84) + '%';
        h.style.fontSize = (16 + Math.random() * 14) + 'px';
        player.appendChild(h);
        setTimeout(() => h.remove(), 3100);
      }, 550);
    }
    function stopIdleHearts() {
      clearInterval(heartTimer);
      heartTimer = null;
    }
    startIdleHearts();

    function setOverlay(msg, opts = {}) {
      ovMsg.textContent = msg;
      overlay.classList.toggle('dimmed', !!opts.dimmed);
      const old = overlay.querySelector('.spinner');
      if (old) old.remove();
      if (opts.spinner) {
        const s = document.createElement('div');
        s.className = 'spinner';
        overlay.insertBefore(s, ovMsg);
      }
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      const old = overlay.querySelector('.spinner');
      if (old) old.remove();
    }

    function play(i) {
      const m = MOTIONS[i];
      current = i;
      MOTIONS.forEach(x => x.btn.classList.remove('playing'));
      m.btn.classList.add('playing');
      status.textContent = m.emoji + ' ' + m.playing;

      stopIdleHearts();
      baseImg.classList.add('hidden');
      video.classList.remove('hidden');

      // Show a spinner if loading takes longer than 300 ms
      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(() => setOverlay('Loading…', { spinner: true, dimmed: true }), 300);

      video.src = VIDEO_DIR + m.file;
      video.load();
      video.play().catch(() => {});
    }

    video.addEventListener('playing', () => {
      clearTimeout(loadingTimer);
      hideOverlay();
    });

    video.addEventListener('ended', () => {
      setOverlay('Tap the screen to watch again!');
      status.textContent = ' ';
      MOTIONS.forEach(x => x.btn.classList.remove('playing'));
    });

    video.addEventListener('error', () => {
      if (!video.src) return;
      clearTimeout(loadingTimer);
      setOverlay('Oops, couldn’t load the video 😢', { dimmed: true });
    });

    // Tap on the player: replay after a video ends, otherwise play a random motion
    player.addEventListener('click', (e) => {
      spawnParticles(e.clientX, e.clientY);
      if (video.ended && current !== null) {
        play(current);
      } else if (video.paused) {
        playRandom();
      }
    });

    function playRandom() {
      let i;
      do { i = Math.floor(Math.random() * MOTIONS.length); }
      while (MOTIONS.length > 1 && i === current);
      play(i);
    }
    randomBtn.addEventListener('click', (e) => {
      playRandom();
      spawnParticles(e.clientX, e.clientY);
    });

    function spawnParticles(x, y) {
      const pool = ['💕', '💛', '✨', '🤍'];
      for (let k = 0; k < 3; k++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = pool[Math.floor(Math.random() * pool.length)];
        p.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
        p.style.top  = (y + (Math.random() - 0.5) * 20) + 'px';
        p.style.animationDelay = (k * 0.08) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1400);
      }
    }
  </script>
</body>
</html>
